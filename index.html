<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropZone | Discover. Ride. Share.</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#09090b',
                        charcoal: '#18181b',
                        neon: '#84cc16',
                        neonHover: '#a3e635',
                        cyan: '#06b6d4',
                        danger: '#ef4444',
                        warning: '#f59e0b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            overflow: hidden; 
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #84cc16; }

        .glass-panel {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #27272a;
        }

        .leaflet-popup-content-wrapper {
            background: #18181b;
            color: #f4f4f5;
            border: 1px solid #84cc16;
            border-radius: 0.75rem;
        }
        .leaflet-popup-tip { background: #18181b; border: 1px solid #84cc16; }
        .leaflet-container a.leaflet-popup-close-button { color: #f4f4f5; }
        
        #app-container { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 400px; min-width: 400px; height: 100vh; overflow-y: auto; z-index: 50; display: flex; flex-direction: column; }
        #map-container { flex-grow: 1; height: 100vh; position: relative; z-index: 10; cursor: crosshair; }

        @media (max-width: 768px) {
            #app-container { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 50vh; min-width: 100%; }
            #map-container { height: 50vh; }
        }

        /* Modal Background Blur */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="antialiased font-sans">

    <div id="app-container">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="glass-panel p-6 shadow-2xl flex flex-col gap-6">
            
            <!-- Logo & Başlık -->
            <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                <div>
                    <h1 class="text-3xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-neon to-cyan">DropZone</h1>
                    <p class="text-zinc-400 text-sm italic flex items-center gap-2">
                        Discover. Ride. Share. 
                        <span class="bg-neon text-obsidian text-[10px] font-bold px-1.5 py-0.5 rounded animate-pulse">LIVE</span>
                    </p>
                </div>
                <i class="fa-solid fa-bicycle text-neon text-3xl"></i>
            </div>

            <!-- AUTH SECTION -->
            <div id="auth-section" class="bg-charcoal p-4 rounded-2xl border border-zinc-800 shadow-inner flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-circle-notch fa-spin text-neon text-2xl"></i>
            </div>

            <!-- Kategori Filtreleme (Yeni Özellik) -->
            <div class="flex flex-col gap-2">
                <h2 class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Filtrele</h2>
                <div class="flex flex-wrap gap-2" id="filter-buttons">
                    <button data-filter="all" class="filter-btn bg-neon text-obsidian px-3 py-1 rounded-full text-xs font-bold transition-colors">Tümü</button>
                    <button data-filter="Urban" class="filter-btn bg-zinc-800 text-zinc-300 hover:text-neon px-3 py-1 rounded-full text-xs font-bold transition-colors">Urban</button>
                    <button data-filter="Freeride" class="filter-btn bg-zinc-800 text-zinc-300 hover:text-neon px-3 py-1 rounded-full text-xs font-bold transition-colors">Freeride</button>
                    <button data-filter="DirtJump" class="filter-btn bg-zinc-800 text-zinc-300 hover:text-neon px-3 py-1 rounded-full text-xs font-bold transition-colors">Dirt Jump</button>
                    <button data-filter="Skatepark" class="filter-btn bg-zinc-800 text-zinc-300 hover:text-neon px-3 py-1 rounded-full text-xs font-bold transition-colors">Skatepark</button>
                </div>
            </div>

            <!-- Stats Chart -->
            <div class="bg-charcoal p-4 rounded-2xl border border-zinc-800">
                <h2 class="text-sm font-bold text-zinc-400 mb-2 uppercase tracking-wider">Topluluk İstatistikleri</h2>
                <div class="relative h-32 w-full">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>

            <!-- Spot List -->
            <div class="flex-grow flex flex-col gap-3">
                <h2 class="text-sm font-bold text-zinc-400 uppercase tracking-wider flex justify-between items-center">
                    <span>Spot Listesi</span>
                    <span id="spot-count" class="bg-zinc-800 text-neon py-0.5 px-2 rounded-full text-xs shadow-[0_0_8px_rgba(132,204,22,0.5)]">0</span>
                </h2>
                <div id="spot-list" class="flex flex-col gap-3 pb-4">
                    <!-- Dinamik veriler buraya dolacak -->
                </div>
            </div>
        </aside>

        <!-- MAP AREA -->
        <main id="map-container">
            <div id="map" class="w-full h-full"></div>
            
            <!-- Map Uyarı Gözlemcisi -->
            <div class="absolute top-4 right-4 z-[400] glass-panel px-4 py-2 rounded-full flex gap-4 text-sm font-semibold pointer-events-none">
                <span class="flex items-center gap-2"><i class="fa-solid fa-circle text-neon"></i> Aktif</span>
                <span class="flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-warning"></i> Dikkat</span>
                <span class="flex items-center gap-2"><i class="fa-solid fa-skull-crossbones text-danger"></i> Yıkılmış</span>
            </div>

            <!-- Floating Action Buttons (Sağ Alt) -->
            <div class="absolute bottom-6 right-6 z-[400] flex flex-col gap-3">
                <button onclick="window.openSettingsModal()" class="w-12 h-12 bg-charcoal border border-zinc-700 hover:border-neon text-white rounded-full shadow-lg flex items-center justify-center text-xl transition-all hover:scale-110">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <button onclick="window.openAddSpotModal()" class="w-14 h-14 bg-neon text-obsidian rounded-full shadow-[0_0_15px_rgba(132,204,22,0.6)] flex items-center justify-center text-2xl font-bold transition-all hover:scale-110 hover:bg-neonHover">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- ADD SPOT MODAL -->
    <div id="add-spot-modal" class="hidden fixed inset-0 z-[1000] modal-overlay flex items-center justify-center p-4">
        <div class="bg-charcoal w-full max-w-md p-6 rounded-2xl border border-zinc-700 shadow-2xl relative transform transition-all">
            <button onclick="window.closeModals()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            
            <h2 class="text-xl font-bold text-zinc-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-location-dot text-neon"></i> Yeni Spot Kaydet
            </h2>
            <p class="text-xs text-zinc-400 mb-4">Haritaya tıklayarak koordinatları otomatik alabilirsin.</p>
            
            <form id="add-spot-form" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Spot Adı</label>
                    <input type="text" id="spot-name" required placeholder="örn: Kalamış Sahil Merdivenleri" class="bg-obsidian border border-zinc-700 text-sm rounded-lg focus:ring-neon focus:border-neon block w-full p-2.5 text-zinc-100">
                </div>
                
                <div>
                    <label class="block text-xs text-zinc-400 mb-1">Kategori</label>
                    <select id="spot-category" required class="bg-obsidian border border-zinc-700 text-sm rounded-lg focus:ring-neon focus:border-neon block w-full p-2.5 text-zinc-100">
                        <option value="" disabled selected>Kategori Seç...</option>
                        <option value="Urban">Urban MTB / Street</option>
                        <option value="Freeride">Freeride / Downhill</option>
                        <option value="DirtJump">Dirt Jump</option>
                        <option value="Skatepark">Skatepark / BMX</option>
                    </select>
                </div>

                <div class="flex gap-3">
                    <div class="w-1/2">
                        <label class="block text-xs text-zinc-400 mb-1">Enlem (Lat)</label>
                        <input type="number" id="spot-lat" step="any" required placeholder="Lat" class="bg-obsidian border border-zinc-700 text-sm rounded-lg block w-full p-2.5 text-zinc-100" readonly>
                    </div>
                    <div class="w-1/2">
                        <label class="block text-xs text-zinc-400 mb-1">Boylam (Lng)</label>
                        <input type="number" id="spot-lng" step="any" required placeholder="Lng" class="bg-obsidian border border-zinc-700 text-sm rounded-lg block w-full p-2.5 text-zinc-100" readonly>
                    </div>
                </div>

                <button type="button" id="btn-get-location" class="text-xs text-cyan hover:text-neon text-left transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-crosshairs"></i> GPS Konumumu Kullan
                </button>

                <button type="submit" class="w-full mt-2 bg-neon hover:bg-neonHover text-obsidian font-bold rounded-lg text-sm px-5 py-3 transition-all transform hover:scale-[1.02]">
                    Spotu Kaydet
                </button>
            </form>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-[1000] modal-overlay flex items-center justify-center p-4">
        <div class="bg-charcoal w-full max-w-sm p-6 rounded-2xl border border-zinc-700 shadow-2xl relative">
            <button onclick="window.closeModals()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            
            <h2 class="text-xl font-bold text-zinc-100 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-gear text-zinc-400"></i> Ayarlar
            </h2>
            
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-bold text-zinc-300 mb-2">Harita Stili</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="window.changeMapStyle('dark')" id="btn-map-dark" class="bg-obsidian border-2 border-neon text-white py-2 rounded-lg text-sm font-bold transition-all">Karanlık (Dark)</button>
                        <button onclick="window.changeMapStyle('satellite')" id="btn-map-sat" class="bg-obsidian border-2 border-zinc-700 text-zinc-400 hover:text-white py-2 rounded-lg text-sm font-bold transition-all">Uydu (Satellite)</button>
                    </div>
                </div>
                
                <div class="mt-4 pt-4 border-t border-zinc-800">
                    <p class="text-xs text-zinc-500 text-center">DropZone MVP v2.0 <br> Powered by Firebase & Leaflet</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS & Chart.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Senin Firebase Ayarların
        const firebaseConfig = {
            apiKey: "AIzaSyCsCXNl2WeTPrY3P1C9c_KXLLwugkuDtkY",
            authDomain: "dropzone-1997f.firebaseapp.com",
            projectId: "dropzone-1997f",
            storageBucket: "dropzone-1997f.firebasestorage.app",
            messagingSenderId: "798012495613",
            appId: "1:798012495613:web:7887c4ff5f236114179094",
            measurementId: "G-RW3YPNCRQ8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let spotsData = []; 
        let activeFilter = 'all';

        // ==========================================
        // HARİTA KURULUMU & STİLLER
        // ==========================================
        const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 10);
        L.control.zoom({ position: 'topleft' }).addTo(map);

        const darkTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM & CARTO', subdomains: 'abcd', maxZoom: 20
        });

        const satTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri', maxZoom: 19
        });

        let currentTileLayer = darkTiles;
        currentTileLayer.addTo(map);

        window.changeMapStyle = (style) => {
            map.removeLayer(currentTileLayer);
            if(style === 'dark') {
                currentTileLayer = darkTiles;
                document.getElementById('btn-map-dark').classList.replace('border-zinc-700', 'border-neon');
                document.getElementById('btn-map-dark').classList.replace('text-zinc-400', 'text-white');
                document.getElementById('btn-map-sat').classList.replace('border-neon', 'border-zinc-700');
                document.getElementById('btn-map-sat').classList.replace('text-white', 'text-zinc-400');
            } else {
                currentTileLayer = satTiles;
                document.getElementById('btn-map-sat').classList.replace('border-zinc-700', 'border-neon');
                document.getElementById('btn-map-sat').classList.replace('text-zinc-400', 'text-white');
                document.getElementById('btn-map-dark').classList.replace('border-neon', 'border-zinc-700');
                document.getElementById('btn-map-dark').classList.replace('text-white', 'text-zinc-400');
            }
            currentTileLayer.addTo(map);
        };

        let markersLayer = L.layerGroup().addTo(map);

        // İkonlar
        const getIconColor = (status) => status === 'warning' ? '#f59e0b' : status === 'destroyed' ? '#ef4444' : '#84cc16';
        const getCategoryIcon = (cat) => {
            if(cat === 'Freeride') return 'fa-mountain';
            if(cat === 'DirtJump') return 'fa-wave-square';
            if(cat === 'Skatepark') return 'fa-person-skating';
            return 'fa-building'; 
        };

        const createCustomMarker = (spot) => {
            const color = getIconColor(spot.status);
            return L.divIcon({
                html: `<div style="background-color: #18181b; border: 2px solid ${color}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px ${color}80; transform: scale(0.9); transition: transform 0.2s;">
                           <i class="fa-solid ${getCategoryIcon(spot.category)}" style="color: ${color}; font-size: 16px;"></i>
                       </div>`,
                className: 'custom-leaflet-marker',
                iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18]
            });
        };

        // ==========================================
        // HARİTAYA TIKLAMA İLE SPOT EKLEME
        // ==========================================
        map.on('click', (e) => {
            if (!currentUser) {
                alert("Kanka haritaya spot fırlatmak için önce giriş yapman lazım!");
                return;
            }
            document.getElementById('spot-lat').value = e.latlng.lat.toFixed(6);
            document.getElementById('spot-lng').value = e.latlng.lng.toFixed(6);
            window.openAddSpotModal(true); // true = haritadan tıklandı, kordinat var
        });


        // ==========================================
        // GRAFİK & UI RENDER
        // ==========================================
        let statsChartInstance = null;
        const renderChart = (spots) => {
            const counts = { 'Urban': 0, 'Freeride': 0, 'DirtJump': 0, 'Skatepark': 0 };
            spots.forEach(s => { if(counts[s.category] !== undefined) counts[s.category]++; });

            const data = {
                labels: Object.keys(counts),
                datasets: [{
                    data: Object.values(counts),
                    backgroundColor: ['#06b6d4', '#84cc16', '#f59e0b', '#ef4444'],
                    borderWidth: 0, hoverOffset: 4
                }]
            };

            if(statsChartInstance) {
                statsChartInstance.data = data;
                statsChartInstance.update();
            } else {
                const ctx = document.getElementById('statsChart').getContext('2d');
                statsChartInstance = new Chart(ctx, {
                    type: 'doughnut', data: data,
                    options: {
                        responsive: true, maintainAspectRatio: false, cutout: '70%',
                        plugins: { legend: { position: 'right', labels: { color: '#a1a1aa', font: { size: 10 } } } }
                    }
                });
            }
        };

        // Auth
        const authSection = document.getElementById('auth-section');

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authSection.innerHTML = `
                    <div class="flex items-center gap-3 w-full justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${user.photoURL}" alt="Profil" class="w-10 h-10 rounded-full border-2 border-neon">
                            <div class="text-left">
                                <p class="text-sm font-bold text-white">${user.displayName}</p>
                                <p class="text-xs text-zinc-400">Onaylı Rider</p>
                            </div>
                        </div>
                        <button onclick="window.logout()" class="text-xs text-zinc-500 hover:text-danger transition-colors" title="Çıkış Yap">
                            <i class="fa-solid fa-right-from-bracket text-lg"></i>
                        </button>
                    </div>
                `;
            } else {
                authSection.innerHTML = `
                    <p class="text-sm text-zinc-400 mb-3">Sisteme spot eklemek veya beğeni atmak için giriş yap.</p>
                    <button onclick="window.loginWithGoogle()" class="w-full bg-white text-obsidian hover:bg-zinc-200 font-bold rounded-lg text-sm px-5 py-2.5 transition-all flex items-center justify-center gap-2">
                        <i class="fa-brands fa-google"></i> Google ile Giriş Yap
                    </button>
                `;
            }
            renderSpotsToDOM(); 
        });

        // Modallar
        window.openAddSpotModal = (hasCoords = false) => {
            if (!currentUser) { alert("Giriş yapmadan spot ekleyemezsin kanka."); return; }
            if(!hasCoords) {
                document.getElementById('spot-lat').value = '';
                document.getElementById('spot-lng').value = '';
            }
            document.getElementById('add-spot-modal').classList.remove('hidden');
        };
        window.openSettingsModal = () => document.getElementById('settings-modal').classList.remove('hidden');
        window.closeModals = () => {
            document.getElementById('add-spot-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.add('hidden');
        };

        window.loginWithGoogle = async () => { try { await signInWithPopup(auth, provider); } catch(e){ alert("Hata oluştu."); } };
        window.logout = async () => { await signOut(auth); };
        window.flyToSpot = (lat, lng) => { map.flyTo([lat, lng], 17, { animate: true, duration: 1.5 }); window.closeModals(); };

        // 1 Hesap = 1 Beğeni Mantığı (ArrayUnion / ArrayRemove)
        window.toggleLikeSpot = async (id, likedByArrayStr) => {
            if (!currentUser) { alert("Beğenmek için giriş yapmalısın."); return; }
            
            const likedBy = JSON.parse(decodeURIComponent(likedByArrayStr));
            const hasLiked = likedBy.includes(currentUser.uid);
            const spotRef = doc(db, 'spots', id);

            try {
                if (hasLiked) {
                    await updateDoc(spotRef, { likedBy: arrayRemove(currentUser.uid) });
                } else {
                    await updateDoc(spotRef, { likedBy: arrayUnion(currentUser.uid) });
                }
            } catch (error) { console.error("Beğeni hatası:", error); }
        };

        window.deleteSpot = async (id) => {
            if(confirm('Kendi eklediğin bu spotu harbiden siliyoruz, emin misin?')) {
                await deleteDoc(doc(db, 'spots', id));
            }
        };

        // Kategori Filtresi
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.replace('bg-neon', 'bg-zinc-800');
                    b.classList.replace('text-obsidian', 'text-zinc-300');
                });
                e.target.classList.replace('bg-zinc-800', 'bg-neon');
                e.target.classList.replace('text-zinc-300', 'text-obsidian');
                activeFilter = e.target.getAttribute('data-filter');
                renderSpotsToDOM();
            });
        });

        // Spotları Ekrana Basan Fonksiyon 
        const renderSpotsToDOM = () => {
            const listContainer = document.getElementById('spot-list');
            listContainer.innerHTML = '';
            markersLayer.clearLayers();

            // Filtreleme
            const filteredSpots = activeFilter === 'all' 
                ? spotsData 
                : spotsData.filter(s => s.category === activeFilter);

            document.getElementById('spot-count').innerText = filteredSpots.length;

            filteredSpots.forEach((spot) => {
                const isOwner = currentUser && currentUser.uid === spot.userId;
                const likedByArray = spot.likedBy || [];
                const likeCount = likedByArray.length;
                const hasLiked = currentUser && likedByArray.includes(currentUser.uid);
                
                // Beğeni Butonu Stili
                const likeIconClass = hasLiked ? "fa-solid text-neon" : "fa-regular text-zinc-400";
                const likeTextClass = hasLiked ? "text-neon" : "text-zinc-400";
                
                // Diziyi string'e çevirip fonksiyona yollamak zorundayız
                const likedByStr = encodeURIComponent(JSON.stringify(likedByArray));

                const deleteButtonHTML = isOwner 
                    ? `<button onclick="window.deleteSpot('${spot.id}')" class="text-xs text-zinc-500 hover:text-danger transition-colors bg-zinc-800/50 px-2 py-1 rounded"><i class="fa-solid fa-trash"></i> Sil</button>` 
                    : '';

                // Popup İçeriği
                const popupContent = `
                    <div class="p-2 min-w-[200px]">
                        <h3 class="font-bold text-lg text-white mb-1">${spot.name}</h3>
                        <p class="text-zinc-400 text-xs mb-3"><i class="fa-solid ${getCategoryIcon(spot.category)}"></i> ${spot.category}</p>
                        <p class="text-zinc-500 text-[10px] mb-3 border-b border-zinc-700 pb-2 flex items-center gap-1">
                            <i class="fa-solid fa-user-astronaut"></i> Ekleyen: <span class="text-zinc-300">${spot.userName || 'Anonim'}</span>
                        </p>
                        <div class="flex justify-between items-center pt-1">
                            <button onclick="window.toggleLikeSpot('${spot.id}', '${likedByStr}')" class="${likeTextClass} hover:text-neon transition flex items-center gap-1 font-bold">
                                <i class="${likeIconClass} fa-heart"></i> ${likeCount}
                            </button>
                            <span class="text-[10px] font-bold px-2 py-1 rounded bg-zinc-800 text-${spot.status === 'active' ? 'neon' : spot.status === 'warning' ? 'warning' : 'danger'} uppercase tracking-wider">
                                ${spot.status}
                            </span>
                        </div>
                    </div>
                `;

                // Marker Ekle
                const marker = L.marker([spot.lat, spot.lng], { icon: createCustomMarker(spot) });
                marker.bindPopup(popupContent);
                markersLayer.addLayer(marker);

                // Listeye Ekle
                const el = document.createElement('div');
                el.className = 'bg-obsidian border border-zinc-800 rounded-xl p-3 flex flex-col gap-2 hover:border-zinc-700 transition-colors cursor-pointer group relative';
                el.innerHTML = `
                    <div class="flex justify-between items-start" onclick="window.flyToSpot(${spot.lat}, ${spot.lng})">
                        <div class="pr-8">
                            <h4 class="font-bold text-sm text-zinc-100 group-hover:text-cyan transition-colors truncate">${spot.name}</h4>
                            <span class="text-[10px] text-zinc-500 block mt-0.5"><i class="fa-solid fa-user-astronaut text-zinc-600"></i> ${spot.userName || 'Anonim'}</span>
                        </div>
                        <div class="bg-charcoal px-2 py-1 rounded text-xs border border-zinc-700 flex items-center gap-1 absolute right-3 top-3">
                            <i class="${hasLiked ? 'fa-solid text-neon' : 'fa-regular text-zinc-400'} fa-heart"></i> <span class="text-zinc-300">${likeCount}</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mt-1">
                        <span class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded">${spot.category}</span>
                        ${deleteButtonHTML}
                    </div>
                `;
                listContainer.appendChild(el);
            });

            // Grafiği tüm verilere göre çiziyoruz (filtreye göre değil)
            renderChart(spotsData);
        };

        // Real-Time Veri Dinleme
        const q = query(collection(db, "spots"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            spotsData = [];
            snapshot.forEach((doc) => {
                spotsData.push({ id: doc.id, ...doc.data() });
            });
            renderSpotsToDOM();
        });

        // Spot Ekleme Submit
        document.getElementById('add-spot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = 'Kaydediliyor...';
            submitBtn.disabled = true;

            try {
                const newSpot = {
                    name: document.getElementById('spot-name').value,
                    category: document.getElementById('spot-category').value,
                    lat: parseFloat(document.getElementById('spot-lat').value),
                    lng: parseFloat(document.getElementById('spot-lng').value),
                    likedBy: [], // Array olarak başlatıyoruz
                    status: 'active',
                    createdAt: Date.now(),
                    userId: currentUser.uid, 
                    userName: currentUser.displayName 
                };

                await addDoc(collection(db, "spots"), newSpot);
                e.target.reset();
                window.closeModals();
                map.flyTo([newSpot.lat, newSpot.lng], 16);
            } catch (error) {
                console.error("Spot eklenirken hata:", error);
                alert("Sistemsel bir sorun çıktı kanka.");
            } finally {
                submitBtn.innerText = 'Spotu Kaydet';
                submitBtn.disabled = false;
            }
        });

        // GPS Konum
        document.getElementById('btn-get-location').addEventListener('click', () => {
            if ("geolocation" in navigator) {
                document.getElementById('btn-get-location').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Konum Aranıyor...';
                navigator.geolocation.getCurrentPosition(position => {
                    document.getElementById('spot-lat').value = position.coords.latitude.toFixed(6);
                    document.getElementById('spot-lng').value = position.coords.longitude.toFixed(6);
                    document.getElementById('btn-get-location').innerHTML = '<i class="fa-solid fa-check text-neon"></i> Konum Bulundu';
                    setTimeout(() => { document.getElementById('btn-get-location').innerHTML = '<i class="fa-solid fa-crosshairs"></i> GPS Konumumu Kullan'; }, 2000);
                }, error => {
                    alert("Konum alınamadı: " + error.message);
                    document.getElementById('btn-get-location').innerHTML = '<i class="fa-solid fa-crosshairs"></i> GPS Konumumu Kullan';
                });
            } else {
                alert("Tarayıcın konumu desteklemiyor.");
            }
        });

    </script>
</body>
</html>
