<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropZone | Discover. Ride. Share.</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#09090b',
                        charcoal: '#18181b',
                        neon: '#84cc16',
                        neonHover: '#a3e635',
                        cyan: '#06b6d4',
                        danger: '#ef4444',
                        warning: '#f59e0b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            overflow: hidden; 
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #84cc16; }

        .glass-panel {
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #27272a;
        }

        .leaflet-popup-content-wrapper {
            background: #18181b;
            color: #f4f4f5;
            border: 1px solid #84cc16;
            border-radius: 0.75rem;
        }
        .leaflet-popup-tip { background: #18181b; border: 1px solid #84cc16; }
        .leaflet-container a.leaflet-popup-close-button { color: #f4f4f5; }
        
        #app-container { display: flex; height: 100vh; width: 100vw; }
        #sidebar { width: 400px; min-width: 400px; height: 100vh; overflow-y: auto; z-index: 50; display: flex; flex-direction: column; }
        #map-container { flex-grow: 1; height: 100vh; position: relative; z-index: 10; }

        @media (max-width: 768px) {
            #app-container { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 50vh; min-width: 100%; }
            #map-container { height: 50vh; }
        }
    </style>
</head>
<body class="antialiased font-sans">

    <div id="app-container">
        
        <!-- SIDEBAR -->
        <aside id="sidebar" class="glass-panel p-6 shadow-2xl flex flex-col gap-6">
            
            <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                <div>
                    <h1 class="text-3xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-neon to-cyan">DropZone</h1>
                    <p class="text-zinc-400 text-sm italic flex items-center gap-2">
                        Discover. Ride. Share. 
                        <span class="bg-neon text-obsidian text-[10px] font-bold px-1.5 py-0.5 rounded animate-pulse">LIVE</span>
                    </p>
                </div>
                <i class="fa-solid fa-bicycle text-neon text-3xl"></i>
            </div>

            <!-- AUTH SECTION -->
            <div id="auth-section" class="bg-charcoal p-4 rounded-2xl border border-zinc-800 shadow-inner flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-circle-notch fa-spin text-neon text-2xl"></i>
            </div>

            <!-- ADD SPOT FORM (Gizli Başlayacak) -->
            <div id="add-spot-form-container" class="hidden bg-charcoal p-4 rounded-2xl border border-zinc-800 shadow-inner">
                <h2 class="text-lg font-bold text-zinc-100 mb-3"><i class="fa-solid fa-location-crosshairs text-neon mr-2"></i>Yeni Spot Ekle</h2>
                <form id="add-spot-form" class="flex flex-col gap-3">
                    <input type="text" id="spot-name" required placeholder="Spot Adı (örn: Beşiktaş Skatepark)" class="bg-obsidian border border-zinc-700 text-sm rounded-lg focus:ring-neon focus:border-neon block w-full p-2.5 text-zinc-100 placeholder-zinc-500">
                    
                    <select id="spot-category" required class="bg-obsidian border border-zinc-700 text-sm rounded-lg focus:ring-neon focus:border-neon block w-full p-2.5 text-zinc-100">
                        <option value="" disabled selected>Kategori Seç...</option>
                        <option value="Urban">Urban MTB / Street</option>
                        <option value="Freeride">Freeride / Downhill</option>
                        <option value="DirtJump">Dirt Jump</option>
                        <option value="Skatepark">Skatepark / BMX</option>
                    </select>

                    <div class="flex gap-2">
                        <input type="number" id="spot-lat" step="any" required placeholder="Enlem (Lat)" class="bg-obsidian border border-zinc-700 text-sm rounded-lg focus:ring-neon focus:border-neon block w-full p-2.5 text-zinc-100 placeholder-zinc-500">
                        <input type="number" id="spot-lng" step="any" required placeholder="Boylam (Lng)" class="bg-obsidian border border-zinc-700 text-sm rounded-lg focus:ring-neon focus:border-neon block w-full p-2.5 text-zinc-100 placeholder-zinc-500">
                    </div>
                    <button type="button" id="btn-get-location" class="text-xs text-cyan hover:text-neon text-left mb-1 transition-colors">
                        <i class="fa-solid fa-crosshairs"></i> Mevcut konumumu kullan
                    </button>

                    <button type="submit" class="w-full bg-neon hover:bg-neonHover text-obsidian font-bold rounded-lg text-sm px-5 py-2.5 text-center transition-all duration-200 transform hover:scale-[1.02]">
                        Haritaya Fırlat
                    </button>
                </form>
            </div>

            <!-- Stats Chart -->
            <div class="bg-charcoal p-4 rounded-2xl border border-zinc-800">
                <h2 class="text-sm font-bold text-zinc-400 mb-2 uppercase tracking-wider">Canlı Topluluk İstatistikleri</h2>
                <div class="relative h-40 w-full">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>

            <!-- Spot List -->
            <div class="flex-grow flex flex-col gap-3">
                <h2 class="text-sm font-bold text-zinc-400 uppercase tracking-wider flex justify-between items-center">
                    <span>Son Eklenenler</span>
                    <span id="spot-count" class="bg-zinc-800 text-neon py-0.5 px-2 rounded-full text-xs shadow-[0_0_8px_rgba(132,204,22,0.5)]">0</span>
                </h2>
                <div id="spot-list" class="flex flex-col gap-3 pb-4">
                    <!-- Dinamik Firebase verisi buraya akacak -->
                </div>
            </div>

        </aside>

        <!-- MAP AREA -->
        <main id="map-container">
            <div id="map" class="w-full h-full"></div>
            
            <div class="absolute top-4 right-4 z-[400] glass-panel px-4 py-2 rounded-full flex gap-4 text-sm font-semibold">
                <span class="flex items-center gap-2"><i class="fa-solid fa-circle text-neon"></i> Aktif</span>
                <span class="flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-warning"></i> Dikkat</span>
                <span class="flex items-center gap-2"><i class="fa-solid fa-skull-crossbones text-danger"></i> Yıkılmış</span>
            </div>
        </main>

    </div>

    <!-- Leaflet JS & Chart.js -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FIREBASE MODULE (ES6) -->
    <script type="module">
        // Firebase Core & Firestore
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        // Firebase Auth
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // ==========================================
        // SENİN FIREBASE AYARLARIN
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCsCXNl2WeTPrY3P1C9c_KXLLwugkuDtkY",
            authDomain: "dropzone-1997f.firebaseapp.com",
            projectId: "dropzone-1997f",
            storageBucket: "dropzone-1997f.firebasestorage.app",
            messagingSenderId: "798012495613",
            appId: "1:798012495613:web:7887c4ff5f236114179094",
            measurementId: "G-RW3YPNCRQ8"
        };

        // Başlat
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let spotsData = []; 

        // Harita Kurulumu
        const map = L.map('map', { zoomControl: false }).setView([41.0082, 28.9784], 10);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM & CARTO', subdomains: 'abcd', maxZoom: 20
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        // İkonlar
        const getIconColor = (status) => status === 'warning' ? '#f59e0b' : status === 'destroyed' ? '#ef4444' : '#84cc16';
        const getCategoryIcon = (cat) => {
            if(cat === 'Freeride') return 'fa-mountain';
            if(cat === 'DirtJump') return 'fa-wave-square';
            if(cat === 'Skatepark') return 'fa-person-skating';
            return 'fa-building'; 
        };

        const createCustomMarker = (spot) => {
            const color = getIconColor(spot.status);
            return L.divIcon({
                html: `<div style="background-color: #18181b; border: 2px solid ${color}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px ${color}80;">
                           <i class="fa-solid ${getCategoryIcon(spot.category)}" style="color: ${color}; font-size: 16px;"></i>
                       </div>`,
                className: 'custom-leaflet-marker',
                iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18]
            });
        };

        // Grafik 
        let statsChartInstance = null;
        const renderChart = (spots) => {
            const counts = { 'Urban': 0, 'Freeride': 0, 'DirtJump': 0, 'Skatepark': 0 };
            spots.forEach(s => { if(counts[s.category] !== undefined) counts[s.category]++; });

            const data = {
                labels: Object.keys(counts),
                datasets: [{
                    data: Object.values(counts),
                    backgroundColor: ['#06b6d4', '#84cc16', '#f59e0b', '#ef4444'],
                    borderWidth: 0, hoverOffset: 4
                }]
            };

            if(statsChartInstance) {
                statsChartInstance.data = data;
                statsChartInstance.update();
            } else {
                const ctx = document.getElementById('statsChart').getContext('2d');
                statsChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: data,
                    options: {
                        responsive: true, maintainAspectRatio: false, cutout: '70%',
                        plugins: { legend: { position: 'right', labels: { color: '#a1a1aa', font: { size: 10 } } } }
                    }
                });
            }
        };

        // Yetkilendirme (Auth) UI Yönetimi
        const authSection = document.getElementById('auth-section');
        const addSpotFormContainer = document.getElementById('add-spot-form-container');

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // Giriş yapılmış
                authSection.innerHTML = `
                    <div class="flex items-center gap-3 w-full justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${user.photoURL}" alt="Profil" class="w-10 h-10 rounded-full border-2 border-neon">
                            <div class="text-left">
                                <p class="text-sm font-bold text-white">${user.displayName}</p>
                                <p class="text-xs text-zinc-400">Rider</p>
                            </div>
                        </div>
                        <button onclick="window.logout()" class="text-xs text-zinc-500 hover:text-danger transition-colors" title="Çıkış Yap">
                            <i class="fa-solid fa-right-from-bracket text-lg"></i>
                        </button>
                    </div>
                `;
                addSpotFormContainer.classList.remove('hidden');
            } else {
                // Giriş yapılmamış
                authSection.innerHTML = `
                    <p class="text-sm text-zinc-400 mb-3">Haritaya spot eklemek ve topluluğa katılmak için giriş yap.</p>
                    <button onclick="window.loginWithGoogle()" class="w-full bg-white text-obsidian hover:bg-zinc-200 font-bold rounded-lg text-sm px-5 py-2.5 transition-all flex items-center justify-center gap-2">
                        <i class="fa-brands fa-google"></i> Google ile Giriş Yap
                    </button>
                `;
                addSpotFormContainer.classList.add('hidden');
            }
            renderSpotsToDOM(); 
        });

        // Global Fonksiyonlar
        window.loginWithGoogle = async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { console.error("Giriş hatası:", error); alert("Giriş yaparken bir sorun çıktı kanka."); }
        };

        window.logout = async () => {
            try { await signOut(auth); } 
            catch (error) { console.error("Çıkış hatası:", error); }
        };

        window.flyToSpot = (lat, lng) => {
            map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
        };

        window.likeSpot = async (id, currentLikes) => {
            const spotRef = doc(db, 'spots', id);
            await updateDoc(spotRef, { likes: currentLikes + 1 });
        };

        window.deleteSpot = async (id) => {
            if(confirm('Kanka kendi eklediğin bu spotu harbiden veritabanından siliyoruz, emin misin?')) {
                await deleteDoc(doc(db, 'spots', id));
            }
        };

        // Spotları Ekrana Basan Fonksiyon 
        const renderSpotsToDOM = () => {
            const listContainer = document.getElementById('spot-list');
            listContainer.innerHTML = '';
            markersLayer.clearLayers();

            document.getElementById('spot-count').innerText = spotsData.length;

            spotsData.forEach((spot) => {
                const isOwner = currentUser && currentUser.uid === spot.userId;
                const deleteButtonHTML = isOwner 
                    ? `<button onclick="window.deleteSpot('${spot.id}')" class="text-xs text-zinc-600 hover:text-danger transition-colors"><i class="fa-solid fa-trash"></i> Sil</button>` 
                    : '';

                // Marker Ekle
                const marker = L.marker([spot.lat, spot.lng], { icon: createCustomMarker(spot) });
                marker.bindPopup(`
                    <div class="p-2 min-w-[200px]">
                        <h3 class="font-bold text-lg text-white mb-1">${spot.name}</h3>
                        <p class="text-zinc-400 text-xs mb-3"><i class="fa-solid ${getCategoryIcon(spot.category)}"></i> ${spot.category}</p>
                        <p class="text-zinc-500 text-[10px] mb-3 border-b border-zinc-700 pb-2">Ekleyen: ${spot.userName || 'Anonim'}</p>
                        <div class="flex justify-between items-center pt-1">
                            <button onclick="window.likeSpot('${spot.id}', ${spot.likes})" class="text-neon hover:text-white transition">
                                <i class="fa-solid fa-fire"></i> ${spot.likes} Hype
                            </button>
                            <span class="text-xs px-2 py-1 rounded bg-zinc-800 text-${spot.status === 'active' ? 'neon' : spot.status === 'warning' ? 'warning' : 'danger'} capitalize">
                                ${spot.status}
                            </span>
                        </div>
                    </div>
                `);
                markersLayer.addLayer(marker);

                // Listeye Ekle
                const el = document.createElement('div');
                el.className = 'bg-obsidian border border-zinc-800 rounded-xl p-3 flex flex-col gap-2 hover:border-zinc-600 transition-colors cursor-pointer group';
                el.innerHTML = `
                    <div class="flex justify-between items-start" onclick="window.flyToSpot(${spot.lat}, ${spot.lng})">
                        <div>
                            <h4 class="font-bold text-zinc-100 group-hover:text-cyan transition-colors">${spot.name}</h4>
                            <span class="text-xs text-zinc-500">${spot.category} • ${spot.userName || 'Anonim'}</span>
                        </div>
                        <div class="bg-charcoal px-2 py-1 rounded text-xs border border-zinc-700 text-zinc-300">
                            <i class="fa-solid fa-fire text-neon"></i> ${spot.likes}
                        </div>
                    </div>
                    <div class="flex gap-2 mt-1">
                        ${deleteButtonHTML}
                    </div>
                `;
                listContainer.appendChild(el);
            });

            renderChart(spotsData);
        };

        // Real-Time Veri Dinleme
        const q = query(collection(db, "spots"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            spotsData = [];
            snapshot.forEach((doc) => {
                spotsData.push({ id: doc.id, ...doc.data() });
            });
            renderSpotsToDOM();
        });

        // Spot Ekleme Gönderimi
        document.getElementById('add-spot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!currentUser) {
                alert("Spot eklemek için giriş yapman lazım kanka!");
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerText = 'Gönderiliyor...';
            submitBtn.disabled = true;

            try {
                const newSpot = {
                    name: document.getElementById('spot-name').value,
                    category: document.getElementById('spot-category').value,
                    lat: parseFloat(document.getElementById('spot-lat').value),
                    lng: parseFloat(document.getElementById('spot-lng').value),
                    likes: 0,
                    status: 'active',
                    createdAt: Date.now(),
                    userId: currentUser.uid, 
                    userName: currentUser.displayName 
                };

                await addDoc(collection(db, "spots"), newSpot);
                e.target.reset();
                map.flyTo([newSpot.lat, newSpot.lng], 14);
            } catch (error) {
                console.error("Spot eklenirken hata:", error);
                alert("Spot eklenemedi amına koyayım, konsola bak.");
            } finally {
                submitBtn.innerText = 'Haritaya Fırlat';
                submitBtn.disabled = false;
            }
        });

        // Konum
        document.getElementById('btn-get-location').addEventListener('click', () => {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    document.getElementById('spot-lat').value = position.coords.latitude;
                    document.getElementById('spot-lng').value = position.coords.longitude;
                    map.setView([position.coords.latitude, position.coords.longitude], 15);
                }, error => alert("Konum alınamadı: " + error.message));
            } else {
                alert("Tarayıcın konumu desteklemiyor.");
            }
        });

    </script>
</body>
</html>
